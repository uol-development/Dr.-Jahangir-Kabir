<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="bgDiet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122319"/>
      <stop offset="55%" stop-color="#1b3b28"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c286"/>
      <stop offset="100%" stop-color="#c9a05c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" fill="url(#bgDiet)"/>
  <circle cx="520" cy="60" r="110" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="80" cy="260" r="90" fill="#c9a05c" fill-opacity="0.08"/>

  <!-- Left Visual: Plate / Macros Breakdown -->
  <g transform="translate(135, 160)">
    <circle cx="0" cy="0" r="86" fill="#0e1d13" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#2ea058" stroke-width="10" stroke-dasharray="260 200" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#e2c286" stroke-width="10" stroke-dasharray="140 320" transform="rotate(115)"/>
    <!-- Leaf icon in center -->
    <path d="M-18,12 C-18,-18 18,-26 24,-26 C24,-26 20,14 -10,18 Z" fill="#2ea058"/>
    <path d="M-16,14 L10,-12" stroke="#e2c286" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="40" text-anchor="middle" fill="#e2c286" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1">100% REAL FOOD</text>
  </g>

  <!-- Right Info Pills -->
  <g transform="translate(265, 62)" font-family="Inter, sans-serif">
    <text x="0" y="0" fill="#e2c286" font-size="12" font-weight="700" letter-spacing="1.5">PILLAR 01 · ORGANIC NUTRITION</text>
    <text x="0" y="28" fill="#ffffff" font-size="21" font-weight="700">Low-Carb Healthy Fat Plate</text>

    <rect x="0" y="48" width="290" height="38" rx="10" fill="#ffffff" fill-opacity="0.09" stroke="#c9a05c" stroke-opacity="0.35"/>
    <circle cx="20" cy="67" r="6" fill="#2ea058"/>
    <text x="36" y="72" fill="#f3f6f4" font-size="13.5" font-weight="600">Green Vegetables, Salad &amp; Fiber</text>

    <rect x="0" y="96" width="290" height="38" rx="10" fill="#ffffff" fill-opacity="0.09" stroke="#c9a05c" stroke-opacity="0.35"/>
    <circle cx="20" cy="115" r="6" fill="#e2c286"/>
    <text x="36" y="120" fill="#f3f6f4" font-size="13.5" font-weight="600">Extra Virgin Olive &amp; Coconut Oil</text>

    <rect x="0" y="144" width="290" height="38" rx="10" fill="#ffffff" fill-opacity="0.09" stroke="#c9a05c" stroke-opacity="0.35"/>
    <circle cx="20" cy="163" r="6" fill="#38bdf8"/>
    <text x="36" y="168" fill="#f3f6f4" font-size="13.5" font-weight="600">Eggs, Fish, Nuts &amp; Chia Seeds</text>

    <rect x="0" y="192" width="290" height="34" rx="8" fill="#ef4444" fill-opacity="0.18" stroke="#f87171" stroke-opacity="0.4"/>
    <text x="16" y="214" fill="#fecaca" font-size="12.5" font-weight="700">✕ Avoid: Sugar, Refined Carbs &amp; Seed Oils</text>
  </g>
</svg>
