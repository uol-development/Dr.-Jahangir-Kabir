<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="bgSleep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="55%" stop-color="#122319"/>
      <stop offset="100%" stop-color="#1e3a2f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" fill="url(#bgSleep)"/>
  <!-- Stars -->
  <circle cx="60" cy="50" r="2" fill="#e2c286" opacity="0.8"/>
  <circle cx="210" cy="40" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="540" cy="55" r="2.2" fill="#e2c286" opacity="0.7"/>
  <circle cx="480" cy="35" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Left Visual: Moon & Circadian Clock -->
  <g transform="translate(135, 160)" font-family="Inter, sans-serif">
    <circle cx="0" cy="0" r="86" fill="#09131c" stroke="#c9a05c" stroke-width="3"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#e2c286" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
    <!-- Crescent Moon -->
    <path d="M10,-38 A34,34 0 1,0 38,12 A26,26 0 1,1 10,-38 Z" fill="#e2c286"/>
    <text x="0" y="42" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">9–10 PM</text>
    <text x="0" y="58" text-anchor="middle" fill="#86efac" font-size="10.5" font-weight="700" letter-spacing="1">DEEP RECOVERY</text>
  </g>

  <!-- Right Details -->
  <g transform="translate(265, 62)" font-family="Inter, sans-serif">
    <text x="0" y="0" fill="#e2c286" font-size="12" font-weight="700" letter-spacing="1.5">PILLAR 04 · CIRCADIAN RHYTHM</text>
    <text x="0" y="28" fill="#ffffff" font-size="21" font-weight="700">Restorative Sleep (7–8 Hours)</text>

    <rect x="0" y="48" width="295" height="46" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#c9a05c" stroke-opacity="0.4"/>
    <text x="16" y="68" fill="#e2c286" font-size="12" font-weight="700">BEDTIME: 9:00 PM – 10:00 PM</text>
    <text x="16" y="85" fill="#e2e8f0" font-size="12.5">Aligns melatonin &amp; peak growth hormone</text>

    <rect x="0" y="104" width="295" height="46" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.4"/>
    <text x="16" y="124" fill="#86efac" font-size="12" font-weight="700">EARLY RISING &amp; MORNING SUNLIGHT</text>
    <text x="16" y="141" fill="#e2e8f0" font-size="12.5">Resets biological clock &amp; cellular energy</text>

    <rect x="0" y="160" width="295" height="46" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="16" y="180" fill="#7dd3fc" font-size="12" font-weight="700">BRAIN &amp; METABOLIC REPAIR</text>
    <text x="16" y="197" fill="#e2e8f0" font-size="12.5">Lowers night cortisol &amp; fasting blood glucose</text>
  </g>
</svg>
